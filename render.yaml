services:
  - type: web
    name: queryshield
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queryshield-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FREE_TOKEN_LIMIT
        value: 10000
      - key: PRO_TOKEN_LIMIT
        value: 100000

databases:
  - name: queryshield-db
    plan: free
    databaseName: queryshield
    user: queryshield
